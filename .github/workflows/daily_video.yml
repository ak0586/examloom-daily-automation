name: Daily Educational Video

permissions:
  contents: write

on:
  schedule:
    - cron: '30 0 * * *'
    - cron: '30 6 * * *'
    - cron: '30 12 * * *'   
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout repository
    - name: Checkout code
      uses: actions/checkout@v3

    # 2️⃣ Setup Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    # 3️⃣ Cache pip dependencies (🔥 THIS IS THE KEY STEP)
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # 4️⃣ Install system dependencies (FFmpeg)
    - name: Install system dependencies (FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    # 5️⃣ Install Python dependencies (uses cache)
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 6️⃣ Recreate credential files from secrets
    - name: Create credentials files from Secrets
      env:
        CLIENT_SECRETS_BASE64: ${{ secrets.CLIENT_SECRETS_BASE64 }}
        YOUTUBE_CREDENTIALS_BASE64: ${{ secrets.YOUTUBE_CREDENTIALS_BASE64 }}
      run: |
        echo "$CLIENT_SECRETS_BASE64" | base64 -d > client_secrets.json
        echo "$YOUTUBE_CREDENTIALS_BASE64" | base64 -d > youtube_credentials.json

    # 7️⃣ Run automation pipeline
    - name: Run Automation Pipeline
      env:
        FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        RUN_MODE: scheduled
      run: python main.py

    # 8️⃣ Commit and push used questions log
    - name: Commit and Push Used Questions Log
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        git add data/used_questions.log
        git diff --quiet && git diff --staged --quiet || \
          (git commit -m "Update used questions log [skip ci]" && git push)

    # 9️⃣ Upload logs as artifact (Runs always)
    - name: Upload Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: automation-logs
        path: logs/
        retention-days: 5
